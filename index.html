	<script>
		const versionsObject = {
			"6.0": "6.0.4",
			"6.1": "6.1.7",
			"6.2": "6.2.3",
			"6.3": "6.3.1",
			"6.4": "6.4.4",
			"6.5": "6.5.8",
			"7.0": "7.0.3",
			"7.1": "7.1.10",
			"7.2": "7.2.5",
			"7.3": "7.3.14",
			"8.0": "8.0.3",
			"8.1": "8.1.10",
			"8.2": "8.2.7",
			"8.3": "8.3.14",
			"8.4": "8.4.6",
			"9.0": "9.0.4",
			"9.1": "9.1.1",
		};

		const allSamplesLists = document.querySelectorAll(".samples-list");

		const createElements = (id) => {
			const list = document.getElementById(id);
			const typeAndRows = id.split("-");

			for (const [key, value] of Object.entries(versionsObject)) {
				const div = document.createElement("div");
				const a = document.createElement("a");

				div.classList.add("samples-list__row");
				a.classList.add("samples-link");
				a.href = `./dhtmlx/${typeAndRows[0]}.html#quantity=${typeAndRows[1]}&version=${key}`;
				a.textContent = `version ${value}`;
				div.appendChild(a);
				list.appendChild(div);
			}
		};

		allSamplesLists.forEach((list) => {
			createElements(list.id);
		});
	</script>
